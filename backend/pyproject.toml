[project]
name = "radar-consorcio"
version = "0.1.0"
description = "RPA que coleta dados públicos do BCB sobre consórcio de motos e entrega relatório por WhatsApp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "playwright>=1.49",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "black>=24.10"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: depende de rede ou do site do BCB; fora da suíte padrão"]
addopts = "-m 'not integration' --strict-markers"
